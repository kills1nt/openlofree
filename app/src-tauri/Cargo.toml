[package]
name = "openlofree-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Desktop app for configuring Lofree Flow 2 keyboards"

[lib]
name = "openlofree_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flow2-core = { path = "../../crates/flow2-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
